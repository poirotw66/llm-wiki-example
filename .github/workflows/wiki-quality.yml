name: Wiki quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  UV_VERSION: "0.11.32"

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Lint scripts and tests
        # --locked so a drifted uv.lock fails here rather than being
        # re-resolved silently; this job has no separate sync step.
        run: uv run --locked --group lint ruff check scripts tests

  test:
    # pyproject declares >=3.10,<3.14 and the docs cover Windows, so both
    # claims are exercised rather than assumed.
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install test dependencies
        run: uv sync --locked --group test
      - name: Confirm the interpreter matches the matrix
        # .python-version pins 3.12; without this the matrix could silently
        # collapse to one interpreter and still report four green legs.
        run: |
          uv run --group test python -c "
          import sys
          found = '.'.join(str(part) for part in sys.version_info[:2])
          assert found == '${{ matrix.python }}', f'expected ${{ matrix.python }}, got {found}'
          print('running on', sys.version)
          "
      - name: Validate docs and Skill contracts
        run: uv run --group test python -m pytest -q tests/test_docs_skill_contract.py
      - name: Run unit tests
        run: uv run --group test python -m pytest --ignore=tests/test_docs_skill_contract.py

  bundle:
    # Needs full history: the raw-immutability and append-only log rules are
    # checked against the pull request base.
    name: knowledge bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install test dependencies
        run: uv sync --locked --group test
      - name: Validate knowledge bundle
        env:
          WIKI_LINT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$WIKI_LINT_BASE" = "0000000000000000000000000000000000000000" ]; then
            uv run --group test python scripts/wiki-lint.py
          else
            uv run --group test python scripts/wiki-lint.py --base "$WIKI_LINT_BASE"
          fi
      - name: Enforce governance admission gate
        env:
          WIKI_LINT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$WIKI_LINT_BASE" = "0000000000000000000000000000000000000000" ]; then
            uv run --group test python scripts/governance-gate.py
          else
            uv run --group test python scripts/governance-gate.py --base "$WIKI_LINT_BASE"
          fi
