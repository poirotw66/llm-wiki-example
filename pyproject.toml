[project]
name = "llm-wiki-example"
version = "0.1.0"
description = "OKF Knowledge Bundle template (optional PDF Docling helpers)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = []

# Optional PDF path (Docling / torch). See docs/pdf-ingest-sop.md → 前置（安裝）.
# Intel macOS (x86_64): PyTorch stopped at 2.2.2 — do NOT require torch>=2.4.
# Apple Silicon / Linux: torch>=2.4 is fine if available.
#
# Install:
#   uv sync --group pdf
#   uv run docling-tools models download -o models/docling
# Models land in models/docling/ (gitignored; ~1.2GB). Do not pass only "rapidocr".
[dependency-groups]
test = [
    "Pillow>=10.0",
    "PyYAML>=6.0.1",
    "pytest>=8.0",
]
lint = [
    "ruff==0.16.3",
]
pdf = [
    "docling>=2.0",
    "torch==2.2.2; platform_system == 'Darwin' and platform_machine == 'x86_64'",
    "torchvision==0.17.2; platform_system == 'Darwin' and platform_machine == 'x86_64'",
    "torch>=2.4; platform_system != 'Darwin' or platform_machine != 'x86_64'",
    "torchvision; platform_system != 'Darwin' or platform_machine != 'x86_64'",
    "numpy<2.0.0; platform_system == 'Darwin' and platform_machine == 'x86_64'",
    "transformers>=4.42.0,<5.0.0; platform_system == 'Darwin' and platform_machine == 'x86_64'",
]

[tool.uv]
package = false
default-groups = []

[tool.ruff]
# Long lines are idiomatic here: lint messages and the Chinese prose in
# docstrings read worse when wrapped.  E501 is not selected below.
target-version = "py310"

[tool.ruff.lint]
# Deliberately narrow: rules that catch real defects, not style opinions.
#   E4/E7/E9 syntax and statement errors   F  pyflakes (undefined, unused)
#   I  import order                        B  bugbear
#   UP pyupgrade (target-version aware)
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = [
    # scripts/ uses hyphenated, unimportable filenames, so each script must
    # extend sys.path before importing its siblings.  The import cannot move
    # to the top of the file.
    "E402",
]

[tool.ruff.lint.per-file-ignores]
# Fixture bundles legitimately shadow builtins and reuse loop variables.
"tests/*" = ["B011"]
